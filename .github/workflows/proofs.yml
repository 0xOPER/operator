name: proofs
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Install the pinned CLIs from the lockfile, by hash, as the runner's user
        working-directory: test/cli-pins
        run: |
          # every tarball by the sha512 the committed lockfile names, and no package script.
          # What the vendors' postinstalls do -- stand the linux-x64 binary at the
          # wrapper's bin -- is done here by link; two of them also run the binary,
          # or install by version when that fails, which is what the hash rules out
          npm ci --ignore-scripts --no-fund --no-audit
          p="$RUNNER_TEMP/cli"
          mkdir -p "$p/bin"
          mv node_modules "$p/"
          ln -s ../node_modules/@anthropic-ai/claude-code-linux-x64/claude "$p/bin/claude"
          ln -s ../node_modules/@openai/codex/bin/codex.js "$p/bin/codex"
          ln -s ../node_modules/opencode-linux-x64/bin/opencode "$p/bin/opencode"
          # the prefix is laid out like an nvm prefix because the jail binds it as
          # /opt/cli and sees nothing else of the runner: codex's launcher needs node
          cp -L "$(command -v node)" "$p/bin/node"
          echo "OPERATOR_CLI_DIR=$p" >> "$GITHUB_ENV"
      - name: Run credential canary walk, topology drill, and live fence placement
        run: |
          test/canary-walk.sh --selftest
          test/topology-drill.sh --selftest
          test/fence-placement.sh --selftest
          test/canary-walk.sh
          test/topology-drill.sh
          test/fence-placement.sh claude-code
          test/fence-placement.sh claude-code control
