<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Watch the narrated OPERATOR overview video">
  <defs>
    <pattern id="vgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1b222a" stroke-width="1"/>
    </pattern>
    <linearGradient id="vcard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#131920"/>
      <stop offset="60%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#15231e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#vcard)"/>
  <rect width="1200" height="220" rx="14" fill="url(#vgrid)" opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#2c3640" stroke-width="1.5"/>
  <rect x="0" y="0" width="8" height="220" rx="4" fill="#4cc38a"/>

  <!-- Play Button Circle -->
  <g transform="translate(56, 56)">
    <circle cx="54" cy="54" r="52" fill="#163429" stroke="#4cc38a" stroke-width="2.5"/>
    <polygon points="44,35 76,54 44,73" fill="#4cc38a"/>
  </g>

  <!-- Text content -->
  <g transform="translate(200, 52)">
    <rect x="0" y="0" width="224" height="28" rx="14" fill="#163429" stroke="#4cc38a" stroke-width="1"/>
    <text x="16" y="19" fill="#4cc38a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.8">NARRATED VIDEO · 2:42</text>

    <text x="0" y="68" fill="#eef2f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Watch the OPERATOR v0.1.0 Overview</text>
    <text x="0" y="104" fill="#8b98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">Why long runs fail · How OPERATOR differs from other orchestrators · Separation of powers · Current state</text>
  </g>

  <!-- Right CTA pill -->
  <g transform="translate(996, 86)">
    <rect x="0" y="0" width="156" height="48" rx="24" fill="#4cc38a"/>
    <text x="78" y="30" text-anchor="middle" fill="#101418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Play MP4 ↗</text>
  </g>
</svg>
